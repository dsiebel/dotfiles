[settings]
activate_aggressive = true
# auto_install = true
experimental = true # needed for hooks
idiomatic_version_file_enable_tools = ["go", "java", "node", "python", "terraform", "helm", "opentofu", "terragrunt"]
# lockfile = true
# paranoid = false
# pin = false
# disable telemetry
use_versions_host = false
use_versions_host_track = false

[tools]
actionlint = "1"
auto-doc = "3"
copier = "9.10.2"
fnox = "1"
grype = "0"
hadolint = "2"
helm = "3"
jq = "1"
kubeconform = "0"
kustomize = "5"
prek = "latest"
shellcheck = "0"
skaffold = "2"
syft = "1"
terraform = "1"
terraform-docs = "0"
terragrunt = "0"
tflint = "0"
tfsec = "1"
trivy = "0"
yamllint = "1"
yq = "4"
